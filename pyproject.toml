[project]
name = "amlc"
version = "0.1.0"
description = "Amazon ML Challenge 2026 - team workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # data
    "numpy",
    "pandas",
    "pyarrow",
    "polars",
    "scipy",
    # classic ML / GBDT
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "catboost",
    "optuna",
    # deep learning (CUDA wheels, see [tool.uv.sources])
    "torch",
    "torchvision",
    "transformers",
    "sentence-transformers",
    "accelerate",
    "peft",
    "timm",
    # images / text utils
    "pillow",
    "opencv-python-headless",
    "rapidfuzz",
    "regex",
    # infra / misc
    "boto3",
    "requests",
    "tqdm",
    "joblib",
    "matplotlib",
    "seaborn",
    "ipykernel",
    "ipywidgets",
]

[project.optional-dependencies]
# Only needed if the problem is image -> text extraction (like 2024). Heavy; install on demand:
#   uv sync --extra ocr
ocr = ["easyocr"]
# SageMaker SDK for launching managed jobs from this laptop (not needed inside SageMaker notebooks).
aws = ["sagemaker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amlc"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
