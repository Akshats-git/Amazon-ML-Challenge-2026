[project]
name = "amlc"
version = "0.1.0"
description = "Amazon ML Challenge 2026 - business entity resolution"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # data
    "numpy",
    "pandas",
    "pyarrow",
    "polars",
    "scipy",
    # classic ML / GBDT
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "catboost",
    "optuna",
    # text embeddings (CUDA wheels, see [tool.uv.sources]); challenge rule: models must be MIT/Apache-2.0, <= 8B params
    "torch",
    "transformers",
    "sentence-transformers",
    "accelerate",
    # entity resolution: string similarity, transliteration, fast sparse top-k
    "rapidfuzz",
    "regex",
    "unidecode",
    "sparse-dot-topn",
    # infra / misc
    "boto3",
    "requests",
    "tqdm",
    "joblib",
    "matplotlib",
    "seaborn",
    "ipykernel",
    "ipywidgets",
]

[project.optional-dependencies]
# SageMaker SDK for launching managed jobs from this laptop (not needed inside SageMaker notebooks).
aws = ["sagemaker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amlc"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
